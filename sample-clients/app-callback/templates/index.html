<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recall callback demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: 1rem 0 0.25rem; }
    input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    .error { color: #b00020; }
    .hint { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Recall callback demo</h1>
  <p class="hint">Runs on this app (port {{ port }}). Enter the image-store host and open its recall flow with this app as callback.</p>

  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('go_recall') }}">
    <label for="store_host">Image store (host:port or URL)</label>
    <input
      type="text"
      id="store_host"
      name="store_host"
      placeholder="localhost:5000"
      value="{{ store_host or 'localhost:5000' }}"
      required
    >
    <button type="submit">Open recall on image store</button>
  </form>

  <p class="hint">Callback URL: <code>{{ url_for('callback', _external=True) }}</code></p>
</body>
</html>
