<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Returning…</title>
</head>
<body>
  <p>Returning selected image(s) to caller…</p>
  <form id="postback" method="post" action="{{ callback }}">
    {% for url in image_urls %}
    <input type="hidden" name="image_url" value="{{ url }}">
    {% endfor %}
  </form>
  <script>document.getElementById('postback').submit();</script>
</body>
</html>
